# Copy to config.toml and edit. Secrets live in .env, not here.

db_path = "data/karpm.db"

# Build each search in your browser: filter by make, model, radius, price,
# whatever you like, then paste the resulting URL here. The scraper paginates
# from this URL, so the filters are yours to control.
#
#   max_ads   Optional cap on how many ads to take. Leave it out to take the
#             whole search; pages are walked until the cap is met, so there is
#             no separate page limit.
#   model     Ads list a "Marke" but no "Modell", so name the model this search
#             targets. Listings are grouped by it to build the price comparables
#             the scoring prompt uses to judge value for money - leave it out
#             and every listing is scored with "no comparable listings in the
#             database".
#
# The web UI edits these on its searches page. Because it regenerates the whole
# block, keep notes of your own above them rather than between the settings.

# [[searches]]
# name = "yamaha-mt07-berlin"
# url = "https://www.kleinanzeigen.de/s-motorraeder-roller/berlin/yamaha-mt-07/k0c305l3331r50"
# make = "Yamaha"
# model = "MT-07"

[[searches]]
name = "yamaha-mt07"
url = "https://www.kleinanzeigen.de/s-motorraeder-roller/yamaha-mt-07/k0c305"
enabled = true
make = "Yamaha"
model = "MT-07"

[scrape]
# Deliberately slow. Two runs a day at this rate is a few hundred requests -
# roughly what a person browsing for an hour would make.
min_delay_s = 4.0
max_delay_s = 9.0
# Images come from a static CDN, not the search backend, and a browser loads a
# whole gallery at once. They are the large majority of a run's requests, so
# pacing them like search queries multiplies the runtime for no benefit.
image_min_delay_s = 0.4
image_max_delay_s = 1.2

# How long to wait before retrying a request that failed for a reason worth
# retrying - a timeout, a dropped connection, a 500. One entry per attempt; the
# last is reused if max_retries exceeds the list. Permanent failures (a 400 or a
# 404) are never retried, whatever this says.
retry_delays_s = [5, 10, 20, 40]
timeout_s = 30.0
max_retries = 3
block_threshold = 3
# Saved pages for diagnosis - block pages, and ad pages whose gallery came up
# short - are written here.
dump_dir = "data/debug"
# How often to re-open an ad we already know, to pick up edits (hours).
refresh_after_hours = 24

# When a listing stops appearing in the search results, open its own page to
# find out whether it is really gone before delisting it. Ads drop out of
# results for reasons that have nothing to do with being sold: the results are
# re-ranked, pagination is capped by max_pages, and a price change can push an
# ad outside the search's own price filter.
verify_delisting = true
# Extra requests one run will spend on those checks; the rest wait for the next
# run and stay active meanwhile.
max_delist_checks = 25
# Skip re-checking a listing confirmed live within this many hours.
recheck_missing_after_hours = 12

# Pacing for `trial`, `probe` and `raw`, and for --fast on any command. The
# production pace above exists for rate limiting, not to look human:
# Kleinanzeigen's bot protection reacts to how fast one IP asks, and the penalty
# is a captcha wall for a few hours. A short interactive run is nowhere near
# that. If you never get blocked, lower the production values too.
[trial]
min_delay_s = 0.5
max_delay_s = 1.5
image_min_delay_s = 0.1
image_max_delay_s = 0.3

[images]
enabled = true
dir = "data/images"
max_per_listing = 12
max_bytes = 5000000
# Stop fetching an ad's photos after this many fail in a row. An ad whose images
# are broken has all of them broken, and each failed photo costs several
# requests while it tries the other renditions.
give_up_after_failures = 3

[scoring]
enabled = true
model = "claude-opus-5"
# low | medium | high | xhigh | max - how hard the model thinks per listing.
effort = "medium"
prompt_version = "v1"
preferences_file = "preferences.md"
# Photos are strong evidence about condition, and cost roughly 1.5k input
# tokens each. Set to 0 to score on text alone.
max_images = 2
rescore_on_change = true
max_per_run = 200

[email]
enabled = true
provider = "resend"
from_address = "karpm@yourdomain.example"
to_addresses = ["you@example.com"]
subject_prefix = "[KARPM]"
# Mail immediately when a listing scores this or better...
instant_min_score = 5
# ...or when a 4+ listing is at least this much under the estimated fair price.
instant_min_bargain_pct = 20
digest_min_score = 3
digest_max_listings = 25
skip_empty_digest = true

[schedule]
# Local time on the Pi. Scrape twice a day, digest once in the morning.
scrape_at = ["07:30", "19:30"]
digest_at = ["08:00"]

[web]
# `karpm web` serves the status page, the listings browser and these settings.
# It binds to localhost, so only this machine can reach it. From another device,
# either tunnel in, which exposes nothing:
#
#     ssh -N -L 8080:localhost:8080 pi@raspberrypi.local
#
# and open http://localhost:8080 there; or set host to "0.0.0.0" below (or run
# `karpm web --lan` once) to open it to your whole network. The page has no
# login, so anyone on that network can change what is scraped and spend Claude
# credits by re-scoring.
#
# Unlike the rest of this file, these two are read at startup: changing them
# needs `karpm web` restarted.
host = "127.0.0.1"
port = 8080
