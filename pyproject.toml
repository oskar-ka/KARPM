[project]
name = "karpm"
version = "0.1.0"
description = "Kleinanzeigenrelevanzpruefungsmaschine - scrapes motorcycle listings and scores them with Claude."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "flask>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
karpm = "karpm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["karpm*"]

[tool.setuptools.package-data]
karpm = ["schema.sql", "web/templates/*.html", "web/static/*", "data/*.csv.gz"]
